# =============================================================================
# metadata-crawler secrets
# =============================================================================
#
# This file holds credentials only. Everything else about a store (its URL,
# database schema, S3 endpoint, ...) belongs in stores.toml next to this file.
#
# Each table below is a named set of credentials. A store in stores.toml
# refers to it by name:
#
#     # stores.toml
#     [prod]
#     url = "postgresql://db.example.org/metadata"
#     secrets = "prod-db"          # <- the [prod-db] table in this file
#
# The keys inside a table are regular storage options. They are merged into
# the store's options when it is opened, with this precedence (strongest
# first):
#
#     1. -s/--storage-option on the command line
#     2. the MDC_STORAGE_OPTIONS environment variable
#     3. this file
#     4. the store's entry in stores.toml
#     5. the backend's own mechanisms (~/.pgpass, AWS profiles, ...)
#
# Credentials taken from this file are never written into catalogue metadata.
# A catalogue only records the name of the secrets it was created with, so
# every reader uses their own credentials.
#
# -----------------------------------------------------------------------------
# Protecting this file
# -----------------------------------------------------------------------------
#
# The file must only be readable by you. metadata-crawler refuses to read it
# if group or others have any access:
#
#     chmod 600 ~/.config/metadata-crawler/secrets.toml
#
# Optionally, encrypt it with age (https://age-encryption.org) and delete the
# plaintext afterwards. metadata-crawler then reads secrets.toml.age instead.
# This needs the "vault" extra: pip install "metadata-crawler[vault]"
#
#     # encrypt to your SSH key, decrypted with ~/.ssh/id_ed25519
#     age -R ~/.ssh/id_ed25519.pub -o secrets.toml.age secrets.toml
#
#     # or encrypt with a passphrase
#     age -p -o secrets.toml.age secrets.toml
#
#     # to edit, decrypt to a private location, change, encrypt again
#     age -d -i ~/.ssh/id_ed25519 secrets.toml.age > "$XDG_RUNTIME_DIR/secrets.toml"
#
# -----------------------------------------------------------------------------
# Syntax notes
# -----------------------------------------------------------------------------
#
# * Values are TOML strings. Passwords containing backslashes or quotes are
#   easiest to write as literal strings in single quotes:  'pa\ss"word'
# * Table names may contain letters, digits, "-" and "_".
# * Everything below is commented out, so a fresh copy of this file has no
#   effect. Uncomment and fill in the sections you need.
#
# =============================================================================


# -----------------------------------------------------------------------------
# PostgreSQL catalogue
# -----------------------------------------------------------------------------
# Used by stores with a postgresql:// URL. "user" and "passwd" are accepted as
# aliases for "username" and "password".
#
# The database name and schema are not secret and belong in stores.toml:
#     database = "metadata"
#     db_schema = "metadata_crawler"
#
# Alternatively, leave the password out and use ~/.pgpass, which the
# PostgreSQL client reads on its own.

# [prod-db]
# username = "metadata"
# password = "change-me"


# -----------------------------------------------------------------------------
# MongoDB catalogue
# -----------------------------------------------------------------------------
# Used by stores with a mongodb:// URL. Authentication happens against the
# "admin" database. "user" and "passwd" are accepted as aliases.

# [mongo-catalogue]
# username = "metadata"
# password = "change-me"


# -----------------------------------------------------------------------------
# S3 (catalogues or data on S3, via s3fs)
# -----------------------------------------------------------------------------
# Access key and secret key. The endpoint is not secret and belongs in
# stores.toml (or the dataset's storage_options):
#     endpoint_url = "https://s3.example.org"
#
# Without credentials, S3 access is anonymous. Instead of this file you can
# also use an AWS profile (~/.aws/credentials) or the AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY environment variables, which s3fs picks up itself.

# [waterpark-s3]
# key = "AKIAXXXXXXXXXXXXXXXX"
# secret = "change-me"

# Temporary credentials additionally need the session token:

# [waterpark-s3-session]
# key = "ASIAXXXXXXXXXXXXXXXX"
# secret = "change-me"
# token = "change-me"


# -----------------------------------------------------------------------------
# OpenStack Swift (data on Swift)
# -----------------------------------------------------------------------------
# The storage and auth URLs are not secret and belong in the dataset's
# storage_options:
#     os_storage_url = "https://swift.example.org/v1/AUTH_project/container"
#     os_auth_url = "https://swift.example.org/auth/v1.0"
#
# Either log in with user, password and project ...

# [swift-login]
# os_user_id = "my-user"
# os_password = "change-me"
# os_project_id = "my-project"

# ... or use an existing auth token. Tokens expire, so this suits short-lived
# jobs rather than a permanent entry:

# [swift-token]
# os_auth_token = "change-me"
