# =============================================================================
# metadata-crawler stores
# =============================================================================
#
# Named catalogue stores. Wherever metadata-crawler expects a store, a name
# from this file works as well as a URL or path:
#
#     mdc glance prod
#     mdc remove prod -f variable pr --dry-run
#     mdc solr index prod
#
# and in Python:  metadata_crawler.remove(store="prod", facets=[...])
#
# -----------------------------------------------------------------------------
# Where stores are defined
# -----------------------------------------------------------------------------
#
# Stores can be defined in several files. Tables with the same name are
# merged, later layers win (weakest first):
#
#     1. /etc/metadata-crawler/stores.toml             site-wide, shared
#     2. ~/.config/metadata-crawler/stores.toml        your own stores
#     3. ~/.config/metadata-crawler/secrets.toml(.age) your credentials
#     4. the MDC_STORAGE_OPTIONS environment variable
#     5. -s/--storage-option on the command line
#
# So a site can define [prod] here, and every user adds their own username
# and password for [prod] in secrets.toml. MDC_STORES points to a different
# file instead of layer 2.
#
# -----------------------------------------------------------------------------
# Keys of a store
# -----------------------------------------------------------------------------
#
#   url          required. Path or URL of the catalogue:
#                  /path/to/catalogue.yml, s3://bucket/catalogue.yml,
#                  postgresql://host/database, mongodb://host
#   backend      optional. "intake", "postgresql" or "mongodb". Only needed
#                  if it can't be inferred from the url.
#   secrets      optional. Read credentials from this table of secrets.toml
#                  instead of the table with the store's own name. Useful
#                  when several stores share one set of credentials.
#   description  optional. Shown by `mdc stores list`.
#
# Every other key is a storage option and passed on to the backend.
#
# -----------------------------------------------------------------------------
# No credentials in this file
# -----------------------------------------------------------------------------
#
# Usernames, passwords, keys, secrets and tokens belong in secrets.toml, which
# must only be readable by you. metadata-crawler warns if it finds them here.
# Credentials are never written into catalogue metadata, whichever file they
# come from.
#
# Everything below is commented out, so a fresh copy of this file has no
# effect. Uncomment and adapt the stores you need.
#
# =============================================================================


# -----------------------------------------------------------------------------
# Intake catalogue on a local or shared file system
# -----------------------------------------------------------------------------
# The YAML file plus its data files (metadata-latest.json.gz, ...), which are
# kept next to it.

# [scratch]
# url = "/work/ab1234/catalogues/scratch.yml"
# description = "My test crawls"


# -----------------------------------------------------------------------------
# Intake catalogue on S3
# -----------------------------------------------------------------------------
# Storage options are the ones of s3fs. The key and secret go into
# secrets.toml under [waterpark]. Without credentials, access is anonymous.

# [waterpark]
# url = "s3://metadata/catalogues/waterpark.yml"
# endpoint_url = "https://s3.example.org"
# description = "Waterpark HEALPix data"

# A read-only view of a public catalogue, no credentials needed:

# [waterpark-public]
# url = "s3://metadata/catalogues/waterpark.yml"
# endpoint_url = "https://s3.example.org"
# anon = true


# -----------------------------------------------------------------------------
# PostgreSQL catalogue
# -----------------------------------------------------------------------------
# The url can carry host, port and database; the separate keys override it.
# Username and password go into secrets.toml under [prod], or into ~/.pgpass.

# [prod]
# url = "postgresql://db.example.org"
# port = 5432
# database = "metadata"
# db_schema = "metadata_crawler"
# description = "Production catalogue"

# A second schema in the same database, sharing the credentials of [prod]:

# [prod-staging]
# url = "postgresql://db.example.org"
# database = "metadata"
# db_schema = "metadata_crawler_staging"
# secrets = "prod"


# -----------------------------------------------------------------------------
# MongoDB catalogue
# -----------------------------------------------------------------------------
# Keys other than database, port and the credentials are added to the
# connection URI as MongoDB options, e.g. tls or replicaSet. Authentication
# happens against "admin" unless authSource says otherwise.

# [mongo]
# url = "mongodb://mongo.example.org"
# database = "metadata"
# tls = true
# replicaSet = "rs0"


# -----------------------------------------------------------------------------
# Local development (docker-compose.yaml of this repository)
# -----------------------------------------------------------------------------
# The compose services listen on localhost. Their credentials are in the
# compose file (username "metadata", password "secret"); put them into
# secrets.toml under [dev-pg] and [dev-mongo], or share one table via
# `secrets = "dev"`.

# [dev-pg]
# url = "postgresql://localhost"
# database = "metadata"
# db_schema = "metadata_crawler"
# secrets = "dev"

# [dev-mongo]
# url = "mongodb://localhost"
# database = "metadata"
# secrets = "dev"
