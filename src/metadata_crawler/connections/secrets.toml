# =============================================================================
# metadata-crawler secrets
# =============================================================================
#
# Credentials for the connections in connections.toml. A table here is merged
# into the connection with the same name:
#
#     # connections.toml              # secrets.toml
#     [prod]                          [prod]
#     url = "postgresql://..."        username = "ab1234"
#                                     password = "..."
#
# A connection with `secrets = "<table>"` reads that table instead, so
# several connections can share one set of credentials. Tables that no
# connection refers to are ignored.
#
# Credentials from this file are never written into catalogue metadata and
# are masked in logs and error messages.
#
# -----------------------------------------------------------------------------
# Location
# -----------------------------------------------------------------------------
#
#     ~/.config/metadata-crawler/secrets.toml.age   (preferred if present)
#     ~/.config/metadata-crawler/secrets.toml
#
# MDC_SECRETS_PATH or --mdc-secrets point to a different file (its .age
# variant is found too); XDG_CONFIG_HOME moves ~/.config.
#
# -----------------------------------------------------------------------------
# Protecting this file
# -----------------------------------------------------------------------------
#
# The file must only be readable by you. metadata-crawler refuses to read it
# if group or others have any access, encrypted or not:
#
#     chmod 600 ~/.config/metadata-crawler/secrets.toml
#
# Optionally encrypt it with age (https://age-encryption.org), save it as
# secrets.toml.age and delete the plaintext. Reading it needs the "vault"
# extra: pip install "metadata-crawler[vault]"
#
#     # to an SSH key; the key must not be passphrase protected
#     age -R ~/.ssh/id_ed25519.pub -o secrets.toml.age secrets.toml
#
#     # to a dedicated age key, created with: age-keygen -o key.txt
#     age -r <public key printed by age-keygen> -o secrets.toml.age secrets.toml
#
#     # with a passphrase
#     age -p -o secrets.toml.age secrets.toml
#
# How the file is decrypted:
#
#   * passphrase files: MDC_SECRETS_PASSPHRASE, otherwise a prompt if a
#     terminal is attached
#   * key files: MDC_AGE_IDENTITY (an SSH private key or an age key file),
#     otherwise ~/.ssh/id_ed25519 and ~/.ssh/id_rsa
#
# The file is decrypted once per `read_configfiles()` block and only in
# memory. To edit it, decrypt it to a private location, change it and
# encrypt it again:
#
#     age -d -i ~/.ssh/id_ed25519 secrets.toml.age > "$XDG_RUNTIME_DIR/secrets.toml"
#
# Encrypting to a key that lies unprotected next to this file guards copies
# of the file (backups, accidental commits), not access to your account.
#
# -----------------------------------------------------------------------------
# Syntax notes
# -----------------------------------------------------------------------------
#
# * Passwords with backslashes or quotes are easiest as literal strings in
#   single quotes:  password = 'pa\ss"word'
# * "user" and "passwd" are accepted as aliases of "username" and "password".
# * Everything below is commented out, so a fresh copy of this file has no
#   effect. Uncomment and fill in the tables you need.
#
# =============================================================================


# -----------------------------------------------------------------------------
# PostgreSQL: [prod] in connections.toml, also used by [prod-staging]
# -----------------------------------------------------------------------------
# Alternatively leave the password out and use ~/.pgpass.

# [prod]
# username = "ab1234"
# password = "change-me"


# -----------------------------------------------------------------------------
# MongoDB: [mongo] in connections.toml
# -----------------------------------------------------------------------------

# [mongo]
# username = "ab1234"
# password = "change-me"


# -----------------------------------------------------------------------------
# S3: [waterpark] in connections.toml
# -----------------------------------------------------------------------------
# key and secret must be given together. Alternatively use an AWS profile
# (~/.aws/credentials) or AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY.

# [waterpark]
# key = "AKIAXXXXXXXXXXXXXXXX"
# secret = "change-me"

# Temporary credentials additionally need the session token:
# token = "change-me"


# -----------------------------------------------------------------------------
# Local development: shared by [dev-pg] and [dev-mongo]
# -----------------------------------------------------------------------------
# The credentials of the repository's docker-compose.yaml.

# [dev]
# username = "metadata"
# password = "secret"
